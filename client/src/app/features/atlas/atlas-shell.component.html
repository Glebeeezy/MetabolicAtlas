<section
  class="canvas-viewport"
  [class.is-dragging]="isDragging()"
  [attr.aria-label]="localeService.locale() === 'ru' ? 'Интерактивная карта метаболизма человека' : 'Interactive Human Metabolic Atlas'"
  (mousedown)="onViewportMouseDown($event)"
  (wheel)="onWheel($event)"
>
  <!-- Top-left overlay: Active Map Context Pill -->
  <ma-atlas-context-pill
    [selectedPathway]="atlasStateService.selectedPathway()"
    [selectedPathwayId]="atlasStateService.selectedPathwayId()"
    [locale]="localeService.locale()"
    [lodLevel]="lodLevel()"
  />

  <!-- Interactive SVG Metabolic Map Canvas -->
  <div
    class="canvas-stage"
    [style.transform]="'translate(' + panX() + 'px, ' + panY() + 'px) scale(' + (zoom() / 100) + ')'"
  >
    <svg
      class="canvas-svg"
      viewBox="-500 -720 4200 4420"
      preserveAspectRatio="xMidYMid meet"
    >
      <defs>
        <!-- Standard Reaction Arrowhead -->
        <marker
          id="rx-arrowhead"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 12 10"
          refX="11"
          refY="5"
          markerWidth="13"
          markerHeight="11"
          orient="auto-start-reverse"
        >
          <path d="M 1 1 L 11 5 L 1 9 z" fill="var(--color-reaction-line, #334155)" />
        </marker>

        <!-- Active/Selected Reaction Arrowhead (Coral) -->
        <marker
          id="rx-arrowhead-active"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 12 10"
          refX="11"
          refY="5"
          markerWidth="14"
          markerHeight="12"
          orient="auto-start-reverse"
        >
          <path d="M 1 1 L 11 5 L 1 9 z" fill="#FB7185" />
        </marker>

        <!-- Hovered Reaction Arrowhead (Cyan) -->
        <marker
          id="rx-arrowhead-hover"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 12 10"
          refX="11"
          refY="5"
          markerWidth="14"
          markerHeight="12"
          orient="auto-start-reverse"
        >
          <path d="M 1 1 L 11 5 L 1 9 z" fill="#38BDF8" />
        </marker>

        <!-- Compact Dual-Lane Opposing Reaction Arrowheads (for reversible ⇄ reactions) -->
        <marker
          id="rx-arrowhead-dual"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 10 8"
          refX="9"
          refY="4"
          markerWidth="9.5"
          markerHeight="7.5"
          orient="auto"
        >
          <path d="M 1 1 L 9 4 L 1 7 z" fill="var(--color-reaction-line, #334155)" />
        </marker>

        <marker
          id="rx-arrowhead-dual-active"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 10 8"
          refX="9"
          refY="4"
          markerWidth="10.5"
          markerHeight="8"
          orient="auto"
        >
          <path d="M 1 1 L 9 4 L 1 7 z" fill="#FB7185" />
        </marker>

        <marker
          id="rx-arrowhead-dual-hover"
          markerUnits="userSpaceOnUse"
          viewBox="0 0 10 8"
          refX="9"
          refY="4"
          markerWidth="10.5"
          markerHeight="8"
          orient="auto"
        >
          <path d="M 1 1 L 9 4 L 1 7 z" fill="#38BDF8" />
        </marker>

        <!-- Cofactor Small Arrowhead -->
        <marker
          id="cofactor-arrowhead"
          viewBox="0 0 8 8"
          refX="6"
          refY="4"
          markerWidth="7"
          markerHeight="7"
          orient="auto"
        >
          <path d="M 1 1.5 L 7 4 L 1 6.5 z" fill="#94A3B8" />
        </marker>

        <!-- Active/Selected Cofactor Arrowhead -->
        <marker
          id="cofactor-arrowhead-active"
          viewBox="0 0 8 8"
          refX="6"
          refY="4"
          markerWidth="7"
          markerHeight="7"
          orient="auto"
        >
          <path d="M 1 1.5 L 7 4 L 1 6.5 z" fill="#E2E8F0" />
        </marker>

        <!-- Cytosolic Hull Glow -->
        <radialGradient id="cytosolGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.05" />
          <stop offset="85%" stop-color="#F59E0B" stop-opacity="0.01" />
          <stop offset="100%" stop-color="transparent" />
        </radialGradient>

        <!-- Subtle Matrix Hull Glow -->
        <radialGradient id="matrixGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.04" />
          <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.008" />
          <stop offset="100%" stop-color="transparent" />
        </radialGradient>

        <!-- Central Hub Beacon Halo Glow -->
        <radialGradient id="hubBeaconGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#10B981" stop-opacity="0.32" />
          <stop offset="50%" stop-color="#10B981" stop-opacity="0.10" />
          <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
        </radialGradient>

        <!-- Sector Radial Gradients -->
        @for (sector of sectorConfigs; track sector.sectorId) {
          <radialGradient [id]="'grad-' + sector.sectorId" cx="50%" cy="50%" r="65%">
            <stop offset="0%" [attr.stop-color]="sector.themeColor" stop-opacity="0.14" />
            <stop offset="65%" [attr.stop-color]="sector.themeColor" stop-opacity="0.03" />
            <stop offset="100%" [attr.stop-color]="sector.themeColor" stop-opacity="0" />
          </radialGradient>
        }
      </defs>

      <!-- 0. Global Polar Coordinates Reference Rings & Sectors -->
      <g class="polar-grid-layer" pointer-events="none">
        <circle cx="1600" cy="1600" r="320" class="polar-grid-circle" />
        <circle cx="1600" cy="1600" r="760" class="polar-grid-circle" />
        <circle cx="1600" cy="1600" r="1300" class="polar-grid-circle" />
        <circle cx="1600" cy="1600" r="1980" class="polar-grid-circle polar-grid-circle--outer" />
        <line x1="1600" y1="-650" x2="1600" y2="3650" class="polar-axis-line" />
        <line x1="-450" y1="1600" x2="3650" y2="1600" class="polar-axis-line" />
      </g>

      <!-- 1. Sector Continents (Macro View LOD 1 & 2) -->
      <g class="sectors-layer">
        @for (sector of sectorConfigs; track sector.sectorId) {
          @let isActive = atlasStateService.selectedPathwayId() === sector.targetPathwayId;
          @let isHov = hoveredSector()?.sectorId === sector.sectorId;

          <g
            class="sector-continent-group"
            [class.is-active]="isActive"
            [class.is-hovered]="isHov"
            (click)="onSectorClick(sector); $event.stopPropagation()"
            (mouseenter)="hoveredSector.set(sector)"
            (mouseleave)="hoveredSector.set(null)"
            role="button"
            tabindex="0"
            [attr.aria-label]="localeService.locale() === 'ru' ? sector.nameRu : sector.nameEn"
          >
            <!-- Continent boundary polygon -->
            <polygon
              [attr.points]="getPolyPoints(sector.boundingPoly)"
              [attr.fill]="'url(#grad-' + sector.sectorId + ')'"
              [attr.stroke]="sector.themeColor"
              class="sector-polygon"
            />

            <!-- Sector Macro Label Badge (Visible at Macro LOD 1) -->
            @if (lodLevel() === 1) {
              <g [attr.transform]="'translate(' + sector.centerX + ',' + sector.centerY + ')'" class="sector-badge-card" pointer-events="none">
                <rect x="-140" y="-28" width="280" height="56" rx="14" class="sector-badge-card__bg" />
                <rect x="-140" y="-28" width="280" height="56" rx="14" class="sector-badge-card__border" [attr.stroke]="sector.themeColor" />
                <circle cx="-116" cy="0" r="5" [attr.fill]="sector.themeColor" />
                <text x="-98" y="-4" class="sector-badge-card__title">
                  {{ localeService.locale() === 'ru' ? sector.nameRu : sector.nameEn }}
                </text>
                <text x="-98" y="14" class="sector-badge-card__desc">
                  {{ localeService.locale() === 'ru' ? sector.categoryRu : sector.categoryEn }}
                </text>
              </g>
            }
          </g>
        }

        <!-- Macro Sub-Pathway Anchor Cards (Visible at Macro LOD 1) -->
        @if (lodLevel() === 1) {
          @for (sub of macroSubpathways; track sub.pathwayId) {
            <g
              class="macro-subpathway-card"
              [class.is-active]="atlasStateService.selectedPathwayId() === sub.pathwayId"
              [attr.transform]="'translate(' + sub.x + ',' + sub.y + ')'"
              (click)="onMacroSubpathwayClick(sub.pathwayId, $event)"
              role="button"
              tabindex="0"
              [attr.aria-label]="localeService.locale() === 'ru' ? sub.titleRu : sub.titleEn"
            >
              <rect x="-108" y="-22" width="216" height="44" rx="11" class="macro-subpathway-card__bg" />
              <rect
                x="-108"
                y="-22"
                width="216"
                height="44"
                rx="11"
                class="macro-subpathway-card__border"
                [attr.stroke]="sub.color"
              />
              <circle cx="-88" cy="0" r="4.5" [attr.fill]="sub.color" />
              <text x="-74" y="-5" class="macro-subpathway-card__title">
                {{ localeService.locale() === 'ru' ? sub.titleRu : sub.titleEn }}
              </text>
              <text x="-74" y="10" class="macro-subpathway-card__desc">
                {{ localeService.locale() === 'ru' ? sub.subtitleRu : sub.subtitleEn }}
              </text>
            </g>
          }
        }
      </g>

      <!-- 2. Pathway Super-Highways (Flux Channels connecting Sectors) -->
      <g class="superhighways-layer">
        @for (hw of visibleSuperHighways(); track hw.id) {
          @let isSel = selectedHighway()?.id === hw.id;
          @let isHov = hoveredHighway()?.id === hw.id;

          <g
            class="superhighway-group"
            [class.is-active]="isSel"
            [class.is-hovered]="isHov"
            (click)="onHighwayClick(hw); $event.stopPropagation()"
            (mouseenter)="hoveredHighway.set(hw)"
            (mouseleave)="hoveredHighway.set(null)"
            role="button"
            tabindex="0"
            [attr.aria-label]="localeService.locale() === 'ru' ? hw.nameRu : hw.nameEn"
          >
            <!-- Wide transparent hitbox -->
            <path
              [attr.d]="hw.pathData"
              class="superhighway-hitbox"
              fill="none"
              stroke="transparent"
              stroke-width="32"
            />
            <!-- Outer soft glow track -->
            <path
              [attr.d]="hw.pathData"
              class="superhighway-glow"
              [attr.stroke]="hw.themeColor"
              fill="none"
              stroke-width="8"
            />
            <!-- Core line with flow dashes -->
            <path
              [attr.d]="hw.pathData"
              class="superhighway-core"
              [class.is-animated]="isFluxAnimated()"
              [attr.stroke]="hw.themeColor"
              fill="none"
              stroke-width="3"
            />
          </g>
        }
      </g>

      <!-- 3. Central Hub Beacon (Acetyl-CoA Anchor 1600, 1600) -->
      <g class="central-hub-beacon" pointer-events="none">
        <circle cx="1600" cy="1600" r="160" fill="url(#hubBeaconGlow)" class="beacon-pulse-halo" />
      </g>

      <!-- 4. Cellular Compartment Backdrops: Cytosol, Envelope & Mitochondrial Matrix -->
      <g class="compartment-layer" pointer-events="none">
        <!-- Cytosol Compartment (Glycolysis + Galactose Leloir + Fructose Fructolysis) -->
        <rect
          x="560"
          y="-640"
          width="2000"
          height="1895"
          rx="32"
          class="compartment-rect compartment-rect--cytosol"
          fill="url(#cytosolGlow)"
        />
        <!-- Glycolysis Cytosolic Banner -->
        <g class="zone-banner zone-banner--amber">
          <rect x="1620" y="-338" width="290" height="24" rx="6" class="zone-banner-bg zone-banner-bg--amber" />
          <text x="1765" y="-326" text-anchor="middle" class="zone-banner-text zone-banner-text--amber">
            {{ localeService.locale() === 'ru' ? 'ГЛИКОЛИЗ • 10 СТАДИЙ (ЦИТОПЛАЗМА)' : 'GLYCOLYSIS • 10 STEPS (CYTOSOL)' }}
          </text>
        </g>

        <!-- Galactose Leloir Sub-Cluster in Left Upper Cytosol -->
        <g class="leloir-cluster-boundary">
          <rect
            x="580"
            y="-335"
            width="770"
            height="315"
            rx="18"
            class="leloir-cluster-rect"
          />
          <g transform="translate(815, -325)">
            <rect x="0" y="0" width="280" height="22" rx="4" class="leloir-badge-bg" />
            <text x="140" y="11" text-anchor="middle" class="leloir-badge-text">
              {{ localeService.locale() === 'ru' ? 'ПУТЬ ЛЕЛУАРА • ГАЛАКТОЗА (4 СТАДИИ)' : 'LELOIR PATHWAY • GALACTOSE (4 STEPS)' }}
            </text>
          </g>
        </g>

        <!-- Glycogen Metabolism Sub-Cluster (Synthesis & Phosphorolysis) -->
        <g class="glycogen-cluster-boundary">
          <rect
            x="1132"
            y="-492"
            width="376"
            height="472"
            rx="18"
            class="glycogen-cluster-rect"
          />
          <g transform="translate(1144, -484)">
            <rect x="0" y="0" width="244" height="22" rx="4" class="glycogen-badge-bg" />
            <text x="122" y="11" text-anchor="middle" class="glycogen-badge-text">
              {{ localeService.locale() === 'ru' ? 'ОБМЕН ГЛИКОГЕНА • СИНТЕЗ И РАСПАД' : 'GLYCOGEN METABOLISM • RESERVE' }}
            </text>
          </g>
        </g>

        <!-- Fructose / Fructolysis Sub-Cluster in Right Cytosol -->
        <g class="fructose-cluster-boundary">
          <rect
            x="1825"
            y="-12"
            width="640"
            height="606"
            rx="18"
            class="fructose-cluster-rect"
          />
          <g transform="translate(1842, -2)">
            <rect x="0" y="0" width="280" height="22" rx="4" class="fructose-badge-bg" />
            <text x="140" y="11" text-anchor="middle" class="fructose-badge-text">
              {{ localeService.locale() === 'ru' ? 'ФРУКТОЛИЗ И ШУНТ HK • ФРУКТОЗА' : 'FRUCTOLYSIS & HK SHUNT • FRUCTOSE' }}
            </text>
          </g>
        </g>

        <!-- Outer & Inner Mitochondrial Membranes (Mitochondrial Envelope) -->
        <g class="membrane-boundary-group">
          <!-- Outer Mitochondrial Membrane (OMM) -->
          <line x1="560" y1="1282" x2="2560" y2="1282" class="membrane-line membrane-line--omm" />
          <text x="576" y="1276" class="membrane-label">
            {{ localeService.locale() === 'ru' ? 'Наружная мембрана митохондрий (НММ)' : 'Outer Mitochondrial Membrane (OMM)' }}
          </text>

          <!-- Intermembrane Space (IMS) -->
          <rect x="560" y="1284" width="2000" height="28" class="ims-strip" />

          <!-- Inner Mitochondrial Membrane (IMM) -->
          <line x1="560" y1="1314" x2="2560" y2="1314" class="membrane-line membrane-line--imm" />
          <text x="576" y="1328" class="membrane-label">
            {{ localeService.locale() === 'ru' ? 'Внутренняя мембрана митохондрий (ВММ)' : 'Inner Mitochondrial Membrane (IMM)' }}
          </text>

          <!-- MPC (Mitochondrial Pyruvate Carrier) Gateway Marker offset clear of arrow axis -->
          <g transform="translate(1672, 1298)" class="mpc-channel-marker">
            <rect x="-42" y="-12" width="84" height="24" rx="6" class="mpc-channel-bg" />
            <text x="0" y="0" class="mpc-channel-text">
              {{ localeService.locale() === 'ru' ? 'МПЦ1/2' : 'MPC1/2' }}
            </text>
          </g>
        </g>

        <!-- Dedicated PDH Complex Transition Frame in Matrix -->
        <g class="pdh-cluster-boundary">
          <rect
            x="1160"
            y="1338"
            width="880"
            height="214"
            rx="18"
            class="pdh-cluster-rect"
          />
          <g transform="translate(1178, 1348)">
            <rect x="0" y="0" width="240" height="22" rx="4" class="pdh-badge-bg" />
            <text x="120" y="11" text-anchor="middle" class="pdh-badge-text">
              {{ localeService.locale() === 'ru' ? 'КОМПЛЕКС ПДХ (E1 • E2 • E3)' : 'PDH COMPLEX (E1 • E2 • E3)' }}
            </text>
          </g>
        </g>

        <!-- Mitochondrial Matrix Compartment (TCA Cycle & PDH) -->
        <rect
          x="960"
          y="1325"
          width="1280"
          height="1360"
          rx="36"
          class="compartment-rect compartment-rect--matrix"
          fill="url(#matrixGlow)"
        />

        <!-- Circular TCA Guide Track -->
        <circle cx="1600" cy="2190" r="420" class="tca-guide-ring" />

        <!-- TCA Matrix Banner centered inside the circle -->
        <g class="zone-banner zone-banner--emerald">
          <rect x="1390" y="1965" width="420" height="24" rx="6" class="zone-banner-bg zone-banner-bg--emerald" />
          <text x="1600" y="1977" text-anchor="middle" class="zone-banner-text zone-banner-text--emerald">
            {{ localeService.locale() === 'ru' ? 'ЦИКЛ ТРИКАРБОНОВЫХ КИСЛОТ • 8 ФЕРМЕНТОВ (МАТРИКС)' : 'TCA CYCLE • 8 ENZYMES (MITOCHONDRIAL MATRIX)' }}
          </text>
        </g>

        <!-- OxPhos Crista Compartment (IMM & Complexes I - V) -->
        <g class="oxphos-cluster-boundary">
          <rect
            x="920"
            y="2730"
            width="1360"
            height="620"
            rx="24"
            class="oxphos-cluster-rect"
          />
          <!-- Intermembrane Space strip (P-side, +) -->
          <rect x="930" y="2738" width="1340" height="42" rx="8" class="oxphos-ims-band" />
          <g transform="translate(940, 2744)">
            <rect x="0" y="0" width="145" height="30" rx="5" class="oxphos-ims-badge-bg" />
            <text x="72" y="11" text-anchor="middle" dominant-baseline="central" class="oxphos-ims-text">
              {{ localeService.locale() === 'ru' ? 'МЕЖМЕМБРАННОЕ ПРОСТРАНСТВО' : 'INTERMEMBRANE SPACE' }}
            </text>
            <text x="72" y="22" text-anchor="middle" dominant-baseline="central" class="oxphos-ims-sub">
              {{ localeService.locale() === 'ru' ? 'P-сторона (+) • IMS' : 'P-side (+) • IMS' }}
            </text>
          </g>

          <!-- Inner Mitochondrial Membrane line (IMM) -->
          <line x1="930" y1="2780" x2="2270" y2="2780" class="membrane-line membrane-line--imm" />
          <text x="942" y="2796" class="membrane-label">
            {{ localeService.locale() === 'ru' ? 'Внутренняя мембрана крист (ВММ)' : 'Inner Crista Membrane (IMM)' }}
          </text>

          <!-- Crista Zone Banner -->
          <g transform="translate(1380, 2718)">
            <rect x="0" y="0" width="440" height="22" rx="4" class="oxphos-badge-bg" />
            <text x="220" y="11" text-anchor="middle" class="oxphos-badge-text">
              {{ localeService.locale() === 'ru' ? 'ДЫХАТЕЛЬНАЯ ЦЕПЬ И АТФ-СИНТАЗА • КРИСТЫ ВММ' : 'ELECTRON TRANSPORT CHAIN & ATP SYNTHASE • CRISTAE' }}
            </text>
          </g>

          <!-- Substrates Inflow Arrows above Complexes -->
          <!-- Inflow 1: NADH from matrix entering Complex I -->
          <path d="M 1140 2690 L 1140 2744" class="substrate-inflow-arrow" marker-end="url(#rx-arrowhead)" />
          <text x="1140" y="2682" class="substrate-inflow-label" text-anchor="middle">
            {{ localeService.locale() === 'ru' ? 'НАДН (матрикс)' : 'NADH (matrix)' }}
          </text>

          <!-- Inflow 2: Succinate from TCA cycle entering Complex II -->
          <path d="M 1300 2690 L 1300 2752" class="substrate-inflow-arrow" marker-end="url(#rx-arrowhead)" />
          <text x="1300" y="2682" class="substrate-inflow-label" text-anchor="middle">
            {{ localeService.locale() === 'ru' ? 'Сукцинат (из ЦТК)' : 'Succinate (from TCA)' }}
          </text>

          <!-- Electron transfer from Complex II to Ubiquinol-10 -->
          <path d="M 1300 2820 C 1300 2885, 1360 2940, 1400 3015" class="electron-transfer-path" marker-end="url(#rx-arrowhead)" />
          <g transform="translate(1335, 2915)">
            <rect x="-16" y="-7" width="32" height="14" rx="3" class="redox-chip-bg" />
            <text x="0" y="0" text-anchor="middle" dominant-baseline="central" class="redox-chip-text">2e⁻</text>
          </g>
        </g>

        <!-- Proton Gradient Visual Layer (PMF & Downhill ATP Synthase Flux) -->
        <g class="proton-gradient-layer" pointer-events="none">
          <!-- Downhill H+ vector: IMS -> Fo rotor -->
          <line x1="2055" y1="2720" x2="2055" y2="2742" class="proton-vector-line proton-vector-line--downhill" marker-end="url(#rx-arrowhead)" />
          <g transform="translate(2055, 2710)">
            <rect x="-24" y="-8" width="48" height="16" rx="4" class="proton-chip-bg proton-chip-bg--atp" />
            <text x="0" y="0" text-anchor="middle" dominant-baseline="central" class="proton-chip-text proton-chip-text--atp">4H⁺ ↓</text>
          </g>

          <!-- Central PMF / Voltage Potential Badge in IMS -->
          <g transform="translate(1395, 2750)">
            <rect x="-85" y="-10" width="170" height="20" rx="5" class="pmf-badge-bg" />
            <text x="0" y="1" text-anchor="middle" dominant-baseline="central" class="pmf-badge-text">
              {{ localeService.locale() === 'ru' ? 'Δψ ≈ −180 мВ • ПДС ≈ 220 мВ' : 'Δψ ≈ −180 mV • PMF ≈ 220 mV' }}
            </text>
          </g>
        </g>
      </g>

      <!-- 5. Metabolic Crossroads (Outbound & Inbound Pathways) -->
      <g class="crossroads-layer" pointer-events="none">
        @for (cr of crossroads; track cr.id) {
          <g class="crossroad-item">
            <line
              [attr.x1]="cr.startX"
              [attr.y1]="cr.startY"
              [attr.x2]="cr.endX"
              [attr.y2]="cr.endY"
              class="crossroad-line"
              marker-end="url(#rx-arrowhead)"
            />
            <rect
              [attr.x]="cr.textX - 8"
              [attr.y]="cr.textY - 14"
              [attr.width]="getCrossroadBadgeWidth(localeService.locale() === 'ru' ? cr.nameRu : cr.nameEn)"
              height="20"
              rx="4"
              class="crossroad-badge-bg"
            />
            <text [attr.x]="cr.textX" [attr.y]="cr.textY" class="crossroad-text">
              {{ localeService.locale() === 'ru' ? cr.nameRu : cr.nameEn }}
            </text>
          </g>
        }
      </g>

      <!-- 3. Primary Reaction Arrows (Modular Component with Tangent Arcs & Clickable Cofactors) -->
      <g class="reactions-layer">
        @for (rx of reactions; track rx.id) {
          @let isSel = selectedReaction()?.id === rx.id;
          @let isHov = hoveredReaction()?.id === rx.id;
          @let isDim = isReactionDimmed(rx.id);

          <g
            ma-reaction-arrow
            class="reaction-arrow-group"
            data-interactive="true"
            [reaction]="rx"
            [isSelected]="isSel"
            [isHovered]="isHov"
            [isDimmed]="isDim"
            [isFluxAnimated]="isFluxAnimated()"
            [selectedCofactorName]="selectedCofactorName()"
            [showEnzymeLabel]="lodLevel() >= 2"
            (reactionClick)="onReactionClick($event)"
            (reactionHover)="hoveredReaction.set($event)"
            (reactionLeave)="hoveredReaction.set(null)"
            (cofactorClick)="onCofactorClick($event)"
          ></g>
        }
      </g>

      <!-- 4. Membrane Complexes Layer (Rendered above reaction paths so efflux arcs pass underneath) -->
      <g class="membrane-complexes-layer">
        <!-- Complex I: L-shaped transmembrane architecture -->
        <g class="membrane-complex-deco" transform="translate(1100, 2748)">
          <svg:title>{{ localeService.locale() === 'ru' ? 'Комплекс I (НАДН:убихинон-оксидоредуктаза)' : 'Complex I (NADH:ubiquinone oxidoreductase)' }}</svg:title>
          <path d="M 0 0 L 80 0 L 80 32 L 50 32 L 50 85 L 0 85 Z" class="complex-protein-body" />
          <text x="40" y="20" text-anchor="middle" class="complex-label">I</text>
          <text x="25" y="60" text-anchor="middle" class="complex-sub">
            {{ localeService.locale() === 'ru' ? 'НАДН-Q' : 'NADH-Q' }}
          </text>
        </g>

        <!-- Complex II: Transmembrane SDH -->
        <g class="membrane-complex-deco" transform="translate(1270, 2755)">
          <svg:title>{{ localeService.locale() === 'ru' ? 'Комплекс II (Сукцинатдегидрогеназа / СДГ)' : 'Complex II (Succinate dehydrogenase / SDH)' }}</svg:title>
          <rect x="0" y="0" width="60" height="65" rx="8" class="complex-protein-body" />
          <text x="30" y="24" text-anchor="middle" class="complex-label">II</text>
          <text x="30" y="44" text-anchor="middle" class="complex-sub">
            {{ localeService.locale() === 'ru' ? 'СДГ' : 'SDH' }}
          </text>
        </g>

        <!-- Complex III: Cytochrome bc1 dimer -->
        <g class="membrane-complex-deco" transform="translate(1520, 2748)">
          <svg:title>{{ localeService.locale() === 'ru' ? 'Комплекс III (Коэнзим Q:цитохром c оксидоредуктаза / Цит. bc₁)' : 'Complex III (Coenzyme Q:cytochrome c oxidoreductase / Cyt bc₁)' }}</svg:title>
          <rect x="0" y="0" width="75" height="75" rx="10" class="complex-protein-body" />
          <text x="37" y="26" text-anchor="middle" class="complex-label">III</text>
          <text x="37" y="46" text-anchor="middle" class="complex-sub">
            {{ localeService.locale() === 'ru' ? 'Цит. bc₁' : 'Cyt bc₁' }}
          </text>
        </g>

        <!-- Complex IV: Cytochrome c Oxidase -->
        <g class="membrane-complex-deco" transform="translate(1775, 2748)">
          <svg:title>{{ localeService.locale() === 'ru' ? 'Комплекс IV (Цитохром c оксидаза / ЦОК)' : 'Complex IV (Cytochrome c oxidase / COX)' }}</svg:title>
          <rect x="0" y="0" width="75" height="75" rx="10" class="complex-protein-body" />
          <text x="37" y="26" text-anchor="middle" class="complex-label">IV</text>
          <text x="37" y="46" text-anchor="middle" class="complex-sub">
            {{ localeService.locale() === 'ru' ? 'ЦОК' : 'COX' }}
          </text>
        </g>

        <!-- Complex V: FoF1 ATP Synthase (Fo rotor in IMM, stalk, F1 catalytic sphere in matrix) -->
        <g class="membrane-complex-deco" transform="translate(2025, 2740)">
          <svg:title>{{ localeService.locale() === 'ru' ? 'Комплекс V (F₀F₁ АТФ-синтаза)' : 'Complex V (F₀F₁ ATP synthase)' }}</svg:title>
          <!-- Fo stator/rotor in IMM -->
          <rect x="8" y="5" width="44" height="28" rx="6" class="complex-protein-body" />
          <text x="30" y="22" text-anchor="middle" class="complex-sub">F₀</text>
          <!-- Central gamma stalk -->
          <line x1="30" y1="33" x2="30" y2="56" class="atp-synthase-stalk" />
          <!-- F1 alpha3-beta3 catalytic head -->
          <circle cx="30" cy="74" r="22" class="complex-protein-body" />
          <text x="30" y="70" text-anchor="middle" class="complex-label">V</text>
          <text x="30" y="84" text-anchor="middle" class="complex-sub">
            {{ localeService.locale() === 'ru' ? 'F₁ АТФ' : 'F₁ ATP' }}
          </text>
        </g>

        <!-- Final ATP Synthesis Product Terminal Badge -->
        <g
          class="atp-terminal-badge"
          transform="translate(2055, 3110)"
          (click)="selectMetaboliteByCode('MET_ATP')"
          role="button"
          tabindex="0"
          [attr.aria-label]="localeService.locale() === 'ru' ? 'Синтез АТФ' : 'ATP Yield'"
        >
          <rect x="-65" y="0" width="130" height="42" rx="10" class="atp-terminal-bg" />
          <text x="0" y="17" text-anchor="middle" class="atp-terminal-title">АТФ ⚡</text>
          <text x="0" y="32" text-anchor="middle" class="atp-terminal-sub">
            {{ localeService.locale() === 'ru' ? 'Синтез АТФ • Продукт' : 'ATP Yield • Product' }}
          </text>
        </g>
      </g>

      <!-- 5. Metabolite Node Tiles (Substrates & Products) -->
      <g class="metabolites-layer">
        @for (met of canvasMetabolites; track met.id) {
          @let isSub = isSubstrateOfSelected(met.id);
          @let isProd = isProductOfSelected(met.id);
          @let isSel = selectedMetabolite()?.id === met.id && !selectedReaction();
          @let isDim = isNodeDimmed(met.id);

          <g
            class="metabolite-tile"
            data-interactive="true"
            [class.is-substrate]="isSub"
            [class.is-product]="isProd"
            [class.is-selected]="isSel"
            [class.is-dimmed]="isDim"
            [class.is-hub]="met.isHub"
            [attr.transform]="'translate(' + met.x + ',' + met.y + ')'"
            (click)="onMetaboliteClick(met); $event.stopPropagation()"
            (mouseenter)="hoveredMetabolite.set(met)"
            (mouseleave)="hoveredMetabolite.set(null)"
            role="button"
            tabindex="0"
            [attr.aria-label]="localeService.locale() === 'ru' ? met.nameRu : met.nameEn"
          >
            <!-- Invisible hitbox -->
            <rect
              x="-6"
              y="-6"
              [attr.width]="met.width + 12"
              [attr.height]="met.height + 12"
              rx="16"
              class="node-hitbox"
              fill="transparent"
            />

            <!-- Card Background -->
            <rect
              [attr.width]="met.width"
              [attr.height]="met.height"
              rx="12"
              class="metabolite-tile__bg"
            />

            <!-- Card Border with dynamic Substrate (Cyan) / Product (Coral) highlighting -->
            <rect
              [attr.width]="met.width"
              [attr.height]="met.height"
              rx="12"
              class="metabolite-tile__border"
            />

            <!-- Micro 2D Chemical Skeleton Icon on the left -->
            <g class="metabolite-tile__structure" transform="translate(10, 8)" [innerHTML]="getSafeSvg(met.skeletalSvg)"></g>

            <!-- Text Information (Macro LOD 1 shows compact abbreviation; Meso/Micro LOD 2-3 shows full name + formula) -->
            @if (lodLevel() === 1) {
              <text x="64" y="42" class="metabolite-tile__abbrev">
                {{ localeService.locale() === 'ru' ? met.abbrevRu : met.abbrevEn }}
              </text>
            } @else {
              <text x="64" y="32" class="metabolite-tile__title">
                {{ localeService.locale() === 'ru' ? met.nameRu : met.nameEn }}
              </text>

              <text x="64" y="49" class="metabolite-tile__formula">
                {{ met.formula }}
              </text>
            }

            <!-- Role Badge when reaction is selected (Вход / Выход) -->
            @if (isSub) {
              @let revMark = selectedReaction()?.isReversible ? ' ⇄' : '';
              <g [attr.transform]="'translate(10, ' + (met.height - 18) + ')'">
                <rect width="110" height="15" rx="3" class="role-badge-bg role-badge-bg--sub" />
                <text x="55" y="11" text-anchor="middle" class="role-badge-text role-badge-text--sub">
                  {{ (localeService.locale() === 'ru' ? 'Вход (Субстрат)' : 'Input (Substrate)') + revMark }}
                </text>
              </g>
            } @else if (isProd) {
              @let revMark = selectedReaction()?.isReversible ? ' ⇄' : '';
              <g [attr.transform]="'translate(10, ' + (met.height - 18) + ')'">
                <rect width="110" height="15" rx="3" class="role-badge-bg role-badge-bg--prod" />
                <text x="55" y="11" text-anchor="middle" class="role-badge-text role-badge-text--prod">
                  {{ (localeService.locale() === 'ru' ? 'Выход (Продукт)' : 'Output (Product)') + revMark }}
                </text>
              </g>
            }
          </g>
        }
      </g>
    </svg>
  </div>

  <!-- Bottom-right overlay: Floating Zoom, Flux & Canvas Controls -->
  <ma-atlas-zoom-controls
    [zoom]="zoom()"
    [locale]="localeService.locale()"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (resetZoom)="resetZoom()"
    (zoomToMacro)="zoomToMacro()"
  />

  <!-- Right Side Inspector: Molecule / Reaction Detail View (Single-Context, Mutex) -->
  @if (selectedReaction() || selectedMetabolite()) {
    <ma-atlas-inspector
      [selectedReaction]="selectedReaction()"
      [selectedMetabolite]="selectedMetabolite()"
      [locale]="localeService.locale()"
      [copyFeedback]="copyFeedback()"
      (closeInspector)="closeInspector()"
    >
      @if (selectedReaction(); as rx) {
        <ma-reaction-inspector
          reaction-view
          [reaction]="rx"
          [locale]="localeService.locale()"
          [metabolites]="allMetabolites"
          (metaboliteClick)="onMetaboliteClick($event)"
        />
      } @else if (selectedMetabolite(); as met) {
        <ma-metabolite-inspector
          metabolite-view
          [metabolite]="met"
          [locale]="localeService.locale()"
          [activePathwayId]="atlasStateService.selectedPathwayId()"
          [relatedReactions]="getReactionsForMetabolite(met.id)"
          (reactionClick)="onReactionClick($event)"
          (reactionCodeClick)="selectReactionByCode($event)"
          (copyText)="copyText($event.text, $event.label)"
        />
      }
    </ma-atlas-inspector>
  }
</section>
