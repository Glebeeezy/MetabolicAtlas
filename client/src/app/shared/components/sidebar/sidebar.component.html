<aside
  class="sidebar"
  [class.is-collapsed]="!sidebarService.isOpen()"
  aria-label="Боковая панель навигации"
>
  <div class="sidebar__inner">
    <!-- Sidebar Top Header (branding only; collapse toggle is in header) -->
    <div class="sidebar__header">
      <div class="sidebar__brand">
        <span class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <circle cx="19" cy="5" r="2"></circle>
            <circle cx="5" cy="19" r="2"></circle>
            <path d="M10.4 10.4L6.4 17.6"></path>
            <path d="M13.6 13.6L17.6 6.4"></path>
          </svg>
        </span>
        <span class="brand-text">Metabolic Atlas</span>
      </div>
    </div>

    <!-- Scrollable Main Section: Only 1 navigation item (Interactive Map) -->
    <div class="sidebar__scrollable">
      <div class="nav-section">
        <div class="nav-section__title">
          {{ localeService.locale() === 'ru' ? 'Разделы атласа' : 'Atlas Sections' }}
        </div>

        <ul class="nav-list">
          <li class="nav-list__item">
            <a
              routerLink="/atlas"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: false }"
              class="nav-link"
              (click)="closeOnMobile()"
            >
              <span class="nav-link__icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
                  <line x1="9" y1="3" x2="9" y2="18"></line>
                  <line x1="15" y1="6" x2="15" y2="21"></line>
                </svg>
              </span>
              <span class="nav-link__title">
                {{ localeService.locale() === 'ru' ? 'Интерактивная карта' : 'Interactive Map' }}
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- Sidebar Footer -->
    <div class="sidebar__footer">
      <div class="sidebar__sources">
        <span class="source-tag">Rhea</span>
        <span class="source-tag">Reactome</span>
        <span class="source-tag">ChEBI</span>
        <span class="source-tag">UniProt</span>
      </div>

      <div class="sidebar__footer-links">
        <a href="/scalar/v1" target="_blank" rel="noopener" class="footer-link" title="OpenAPI / Scalar">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>API Docs</span>
        </a>
        <a href="https://github.com/Glebeeezy/MetabolicAtlas" target="_blank" rel="noopener" class="footer-link" title="GitHub repository">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
          <span>GitHub</span>
        </a>
      </div>
    </div>
  </div>
</aside>

<!-- Mobile backdrop -->
@if (sidebarService.isOpen()) {
  <div
    class="sidebar-backdrop"
    (click)="sidebarService.setOpen(false)"
    aria-hidden="true"
  ></div>
}
