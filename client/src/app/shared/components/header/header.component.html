<header class="header">
  <div class="header__inner">
    <!-- Left: Sidebar Toggle & Breadcrumb Title -->
    <div class="header__left">
      <button
        type="button"
        class="header__sidebar-toggle"
        (click)="sidebarService.toggle()"
        [attr.aria-label]="sidebarService.isOpen() ? (localeService.locale() === 'ru' ? 'Скрыть панель' : 'Collapse sidebar') : (localeService.locale() === 'ru' ? 'Открыть панель' : 'Open sidebar')"
        [title]="sidebarService.isOpen() ? (localeService.locale() === 'ru' ? 'Скрыть панель' : 'Collapse sidebar') : (localeService.locale() === 'ru' ? 'Открыть панель' : 'Open sidebar')"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          @if (sidebarService.isOpen()) {
            <path d="m14 9-3 3 3 3"></path>
          } @else {
            <path d="m12 9 3 3-3 3"></path>
          }
        </svg>
      </button>

      <div class="header__title-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="title-text">Metabolic Atlas</span>
        <span class="version-tag">{{ localeService.locale() === 'ru' ? 'Человек' : 'Human' }}</span>
      </div>
    </div>

    <!-- Right: Language Switcher on the left, Animated Theme Switcher on the right -->
    <div class="controls">
      <ma-locale-switcher />
      <ma-theme-switcher />
    </div>
  </div>
</header>
