<header class="header">
  <div class="header__inner">
    <!-- Left: Sidebar Toggle & Breadcrumb Title -->
    <div class="header__left">
      <button
        type="button"
        class="header__sidebar-toggle"
        (click)="sidebarService.toggle()"
        [attr.aria-label]="sidebarService.isOpen() ? 'Скрыть панель' : 'Открыть панель'"
        [title]="sidebarService.isOpen() ? 'Скрыть панель' : 'Открыть панель'"
      >
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2"></rect>
          <path d="M9 3v18"></path>
          @if (sidebarService.isOpen()) {
            <path d="m14 9-3 3 3 3"></path>
          } @else {
            <path d="m12 9 3 3-3 3"></path>
          }
        </svg>
      </button>

      <div class="header__title-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="title-text">Metabolic Atlas</span>
        <span class="version-tag">v1.0</span>
      </div>
    </div>

    <!-- Center: Main Navigation Links -->
    <nav class="nav" aria-label="Main Navigation">
      <a routerLink="/atlas" routerLinkActive="active" class="nav__link">
        <span class="nav__icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon>
            <line x1="9" y1="3" x2="9" y2="18"></line>
            <line x1="15" y1="6" x2="15" y2="21"></line>
          </svg>
        </span>
        <span>{{ localeService.locale() === 'ru' ? 'Атлас' : 'Atlas' }}</span>
      </a>

      <a routerLink="/pathways" routerLinkActive="active" class="nav__link">
        <span class="nav__icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"></circle>
            <circle cx="18" cy="18" r="3"></circle>
            <path d="M6 9v3a6 6 0 0 0 6 6h3"></path>
          </svg>
        </span>
        <span>{{ localeService.locale() === 'ru' ? 'Пути' : 'Pathways' }}</span>
      </a>

      <a routerLink="/search" routerLinkActive="active" class="nav__link">
        <span class="nav__icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <span>{{ localeService.locale() === 'ru' ? 'Поиск' : 'Search' }}</span>
      </a>

      <a routerLink="/articles" routerLinkActive="active" class="nav__link">
        <span class="nav__icon" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
            <path d="M6 6h10"></path>
            <path d="M6 10h10"></path>
          </svg>
        </span>
        <span>{{ localeService.locale() === 'ru' ? 'Статьи' : 'Articles' }}</span>
      </a>
    </nav>

    <!-- Right: Language Switcher on the left, Animated Theme Switcher on the right -->
    <div class="controls">
      <ma-locale-switcher />
      <ma-theme-switcher />
    </div>
  </div>
</header>
