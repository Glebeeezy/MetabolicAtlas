<button
  type="button"
  class="theme-toggle"
  [class.theme-toggle--dark]="themeService.theme() === 'dark'"
  (click)="toggle()"
  role="switch"
  [attr.aria-checked]="themeService.theme() === 'dark'"
  [attr.aria-label]="themeService.theme() === 'dark' ? 'Включить светлую тему' : 'Включить тёмную тему'"
  [title]="themeService.theme() === 'dark' ? 'Переключить на светлую тему' : 'Переключить на тёмную тему'"
>
  <span class="theme-toggle__track">
    <!-- Day sky clouds -->
    <span class="theme-toggle__clouds" aria-hidden="true">
      <span class="cloud cloud--1"></span>
      <span class="cloud cloud--2"></span>
      <span class="cloud cloud--3"></span>
    </span>

    <!-- Night sky stars -->
    <span class="theme-toggle__stars" aria-hidden="true">
      <span class="star star--1"></span>
      <span class="star star--2"></span>
      <span class="star star--3"></span>
      <span class="star star--4"></span>
    </span>

    <!-- Animated Sun / Moon Knob -->
    <span class="theme-toggle__thumb">
      <span class="celestial-body">
        <!-- Moon craters -->
        <span class="crater crater--1"></span>
        <span class="crater crater--2"></span>
        <span class="crater crater--3"></span>
      </span>
    </span>
  </span>
</button>
